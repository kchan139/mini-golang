name: 01-Lexer Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lexer-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      
      - name: Run lexical analysis tests
        run: |
          cd MiniGo/src
          python main.py gen && clear
          rm -f ./test/testcases/* 2>/dev/null
          rm -f ./test/solutions/* 2>/dev/null
          python main.py test LexerSuite