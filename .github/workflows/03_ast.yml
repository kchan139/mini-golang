name: 03-AST Tests

on:
  workflow_run:
    workflows: ["02-Parser Tests"]
    types:
      - completed
    branches: [main]
  workflow_dispatch:

jobs:
  ast-test:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      
      - name: Generate test files and clear screen
        run: python main.py gen && clear
      
      - name: Clean test directories
        run: |
          rm -f ./test/testcases/* 2>/dev/null
          rm -f ./test/solutions/* 2>/dev/null
      
      - name: Run AST generation tests
        run: python main.py test ASTGenSuite